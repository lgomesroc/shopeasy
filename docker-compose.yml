services:
  mysql:
    image: mysql:8.0
    container_name: shopeasy_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 5577azcD@#
      MYSQL_DATABASE: shopeasy_db
      MYSQL_USER: lgomesroc
      MYSQL_PASSWORD: 12345
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  users_backend:
    build: ./backend/users
    container_name: users_service
    ports:
      - "8001:8000"
    depends_on:
      - mysql

  products_backend:
    build: ./backend/products
    container_name: products_service
    ports:
      - "8002:8000"
    depends_on:
      - mysql

  orders_backend:
    build: ./backend/orders
    container_name: orders_service
    ports:
      - "8003:8000"
    depends_on:
      - mysql

  core_frontend:
    build: ./frontend/src/app/core
    container_name: core_service
    ports:
      - "4201:4200"
    depends_on:
      - users_backend
      - products_backend
      - orders_backend

  shared_frontend:
    build: ./frontend/src/app/shared
    container_name: shared_service
    ports:
      - "4202:4200"
    depends_on:
      - core_frontend

  users_frontend:
    build: ./frontend/src/app/users
    container_name: users_service_frontend
    ports:
      - "4203:4200"
    depends_on:
      - core_frontend

  products_frontend:
    build: ./frontend/src/app/products
    container_name: products_service_frontend
    ports:
      - "4204:4200"
    depends_on:
      - core_frontend

  orders_frontend:
    build: ./frontend/src/app/orders
    container_name: orders_service_frontend
    ports:
      - "4205:4200"
    depends_on:
      - core_frontend

volumes:
  mysql_data:
