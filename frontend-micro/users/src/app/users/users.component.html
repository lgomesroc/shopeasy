<div class="container mx-auto p-4">
  <h1 class="text-2xl font-bold mb-4">Gerenciamento de Usuários</h1>

  <div class="bg-white shadow-md rounded p-4 mb-6">
    <h2 class="text-lg font-semibold mb-4">{{ isEditing ? 'Editar Usuário' : 'Adicionar Novo Usuário' }}</h2>

    <div class="mb-4">
      <label class="block text-gray-700 mb-2" for="name">Nome</label>
      <input
        type="text"
        id="name"
        [(ngModel)]="newUser.name"
        class="w-full border border-gray-300 p-2 rounded"
        placeholder="Nome do usuário">
    </div>

    <div class="mb-4">
      <label class="block text-gray-700 mb-2" for="email">Email</label>
      <input
        type="email"
        id="email"
        [(ngModel)]="newUser.email"
        class="w-full border border-gray-300 p-2 rounded"
        placeholder="Email do usuário">
    </div>

    <div class="mb-4">
      <label class="block text-gray-700 mb-2" for="role">Função</label>
      <select
        id="role"
        [(ngModel)]="newUser.role"
        class="w-full border border-gray-300 p-2 rounded">
        <option value="admin">Administrador</option>
        <option value="manager">Gerente</option>
        <option value="customer">Cliente</option>
      </select>
    </div>

    <div class="flex space-x-2">
      <button
        (click)="saveUser()"
        class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
        {{ isEditing ? 'Atualizar' : 'Salvar' }}
      </button>

      <button
        *ngIf="isEditing"
        (click)="resetForm()"
        class="bg-gray-500 text-white px-4 py-2 rounded hover:bg-gray-600">
        Cancelar
      </button>
    </div>
  </div>

  <div class="bg-white shadow-md rounded overflow-hidden">
    <table class="min-w-full">
      <thead class="bg-gray-100">
      <tr>
        <th class="py-2 px-4 text-left">ID</th>
        <th class="py-2 px-4 text-left">Nome</th>
        <th class="py-2 px-4 text-left">Email</th>
        <th class="py-2 px-4 text-left">Função</th>
        <th class="py-2 px-4 text-left">Ações</th>
      </tr>
      </thead>
      <tbody>
      <tr *ngFor="let user of users" class="border-t border-gray-200">
        <td class="py-2 px-4">{{ user.id }}</td>
        <td class="py-2 px-4">{{ user.name }}</td>
        <td class="py-2 px-4">{{ user.email }}</td>
        <td class="py-2 px-4">{{ user.role }}</td>
        <td class="py-2 px-4">
          <button
            (click)="editUser(user)"
            class="text-blue-500 hover:underline mr-2">
            Editar
          </button>
          <button
            (click)="deleteUser(user.id)"
            class="text-red-500 hover:underline">
            Excluir
          </button>
        </td>
      </tr>
      <tr *ngIf="users.length === 0">
        <td colspan="5" class="py-4 px-4 text-center text-gray-500">
          Nenhum usuário encontrado
        </td>
      </tr>
      </tbody>
    </table>
  </div>
</div>
